version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - gocritic
    - misspell
    - nilerr
    - reassign
    - sloglint
    - unconvert
    - unparam
  settings:
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - commentedOutCode
      enabled-tags:
        - diagnostic
        - performance
    misspell:
      locale: US
    sloglint:
      # Every slog call must use the ...Context variant threading the span-carrying ctx,
      # so log records land correlated with the trace/span that emitted them (T5.14,
      # specs/observability.md). A non-context log call fails the gate.
      context: all
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - unparam
        path: _test\.go
    paths:
      - .*_templ\.go$
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
