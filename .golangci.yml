version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - gocritic
    - misspell
    - nilerr
    - reassign
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*github.com/jackc/pgx/v5.Tx).Rollback
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - commentedOutCode
      enabled-tags:
        - diagnostic
        - performance
    misspell:
      locale: US
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: internal/controlplane/server/
        text: Render
      - linters:
          - bodyclose
        source: websocket\.Dial
      - linters:
          - unparam
        path: internal/agent/controlplane/wsclient_handlers\.go
      - linters:
          - unparam
        path: internal/controlplane/auth/auth\.go
        text: generateRandomHex
      - linters:
          - errcheck
          - unparam
        path: _test\.go
    paths:
      - .*_templ\.go$
      - internal/controlplane/store
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

