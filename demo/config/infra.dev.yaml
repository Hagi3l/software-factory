# Demo infrastructure overlay (env: dev) — points the harness at a LOCAL model served by
# Ollama through its OpenAI-compatible endpoint, so the demo runs with no API key and no
# cost. See demo/README.md.
#
# The model call is made by the runner on the HOST (the trusted side holds the adapter),
# NOT from inside the sandbox — the agent only emits a canonical request and the runner
# calls Ollama. So `localhost:11434` is reached from the host and the sandbox stays
# zero-network, which is the whole point. (run.sh exports a dummy OPENAI_API_KEY because
# the OpenAI Go SDK requires a non-empty key even though Ollama ignores it.)
sandbox:
  backend: docker
  egress:  broker-only
  # A weak local model is slow, and `wall` bounds the WHOLE invocation including the time
  # the runner spends waiting on inference. Set generously; raise it if a stage dead-letters
  # with a wall-budget reason on slow hardware. The page build itself needs little CPU/mem.
  limits:  { cpu: 2, mem: 2Gi, wall: 45m }
  # profiles resolves the logical profile a soul names (soul.sandbox: go-toolchain) to the
  # concrete image the docker backend boots. The demo reuses the kernel go-toolchain image
  # (bash + grep + git is all the static-HTML gate needs); run.sh builds it locally tagged
  # `go-toolchain`, so the profile maps to that bare tag rather than harness/go-toolchain:dev.
  profiles:
    go-toolchain:
      image: go-toolchain
nats:
  url: nats://localhost:4222
  jetstream: { replicas: 1, max_age: 168h }
broker:
  allowlist: [llm-api, nats, git]
artifacts:
  backend: files
  path: ./.harness/artifacts
otel:
  endpoint: ""        # tracing off for the demo ("stdout" to see spans, host:port for OTLP)
models:
  # The local model, named EXACTLY as `ollama list` shows it — the registry key is sent
  # verbatim to Ollama as the model field, and the souls below reference this same name.
  # run.sh substitutes this (and the endpoint) when you set MODEL= / OLLAMA_HOST=.
  # No `cost` block ⇒ $0; spend is bounded by the token and wall caps in harness.yaml.
  "qwen3.6:27b":
    provider: openai-compat
    endpoint: http://localhost:11434/v1
