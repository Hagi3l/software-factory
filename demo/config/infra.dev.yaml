# Demo infrastructure overlay (env: dev) — points the harness at a REMOTE model served by
# OpenRouter through its OpenAI-compatible endpoint. See demo/README.md.
#
# The model call is made by the runner on the HOST (the trusted side holds the adapter +
# the API key), NOT from inside the sandbox — the agent only emits a canonical request and
# the runner calls OpenRouter. So `openrouter.ai` is reached from the host and the sandbox
# stays zero-network, which is the whole point. (run.sh requires OPENAI_API_KEY to hold
# your OpenRouter key — the openai-compat adapter sends it as the bearer token.)
sandbox:
  backend: docker
  egress:  broker-only
  # `wall` bounds the WHOLE invocation including the time the runner spends waiting on
  # inference. A hosted model is fast, but keep this generous so a slow network round-trip
  # never dead-letters a stage. The page build itself needs little CPU/mem.
  limits:  { cpu: 2, mem: 2Gi, wall: 20m }
  # profiles resolves the logical profile a soul names (soul.sandbox: go-toolchain) to the
  # concrete image the docker backend boots. The demo reuses the kernel go-toolchain image
  # (bash + grep + git is all the static-HTML gate needs); run.sh builds it locally tagged
  # `go-toolchain`, so the profile maps to that bare tag rather than harness/go-toolchain:dev.
  profiles:
    go-toolchain:
      image: go-toolchain
nats:
  url: nats://localhost:4222
  jetstream: { replicas: 1, max_age: 168h }
broker:
  allowlist: [llm-api, nats, git]
artifacts:
  backend: files
  path: ./.harness/artifacts
otel:
  endpoint: ""        # tracing off for the demo ("stdout" to see spans, host:port for OTLP)
models:
  # The OpenRouter model slug, sent verbatim as the request's model field; the souls below
  # reference this same registry key. run.sh substitutes this (and the endpoint) when you
  # set MODEL= / MODEL_ENDPOINT=.
  # cost is the per-million-token price → USD accounting for the policy.budget dollar cap;
  # spend is also bounded by the token and wall caps regardless.
  "deepseek/deepseek-v4-flash":
    provider: openai-compat
    endpoint: https://openrouter.ai/api/v1
    cost: { input_per_mtok: 0.0983, output_per_mtok: 0.1966 }
