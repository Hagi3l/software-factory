# Vault demo workflow — the FULL pipeline (requirements -> plan -> author-tests ->
# implement -> qa -> integrate) run against an established Go/templ/htmx/SQLite app.
#
# This is a self-contained demo config (separate from the harness's own config/), so it
# can't disturb the real pipeline. Unlike the landing-page demo it exercises the whole DAG
# — including decomposition and a real Go/security qa gate — on a non-trivial codebase. The
# operator drafts a new feature requirement live in the control-room Create-Task wizard
# (the `requirements` human stage), and the autonomous stages take it to a single atomic
# merge on `main` (epic mode — see `integration` below).
#
# Differences from the shipped config/harness.yaml, and why:
#   - qa drops `mutation>=0.8`. Gremlins mutation testing is slow and flaky for a live demo
#     and is not baked into the vault-toolchain image; the security-relevant scanners
#     (gosec/govulncheck/license-scan) plus lint and the red->green proof stay, which is the
#     SecTalks-relevant story. The merge-queue re-gate still re-verifies the rebased result.
#   - `profile: autonomous`, no `tcb_paths`. The candidate diff is ordinary app code in a
#     throwaway repo (no harness TCB path), so integrate merges hands-free — no `harness
#     approve` step. Flip to trusted-dev (+ tcb_paths + a `human-approved` postcondition on
#     integrate) to demo the approval gate instead.
#   - `integration.mode: epic`. The shipped config is per-item (the kernel default — each work
#     item lands on `main` as it verifies). Here the wizard-drafted feature lands ATOMICALLY:
#     every child integrates onto an `epic/<id>` branch and `main` advances exactly once, by
#     the terminal merge, when the subtree drains — so the public-repo push + VPS deploy fires
#     once per feature, not once per child. The unit of integration is the feature the human
#     drafted, which is also the unit of deploy.
#   - `checks` resolve to the *vault app's* make targets (its Makefile travels in the seed
#     repo), not the harness's. That is the whole point: the gate runs the target project's
#     own QA in a clean sandbox.
#
# See demo/vault/README.md, specs/workflow.md, specs/verification.md.

# Spec context horizon: hand each agent the issue's referenced spec file plus its directly
# cross-linked neighbours (the vault's specs/ are small and cross-linked, so 1 hop carries
# the contract and the conventions it leans on).
spec_depth: 1

# Ambient specs (T3.14): the spec index + the engineering conventions, injected into EVERY agent's
# Brief regardless of which feature spec the issue points at. The vault's conventions
# (parameterized-SQL-only, crypto/rand, encryption-non-negotiable, "make generate after a .templ
# edit", no-new-modules under the zero-network sandbox) are the same for every change but are NOT in
# any one feature spec — so an agent that only saw auth.md would rediscover or trip them. Prepended
# ahead of the bounded slice (a cache-stable prefix) and covered by the spec content hash, so editing
# conventions.md re-derives work like a contract edit. specs/README.md is a thin index (the agent
# read_file's the rest on demand). See specs/specs-process.md "Ambient specs".
ambient_specs: [specs/README.md, specs/conventions.md]

# The requirements planner behind the control-room Create-Task wizard: the trusted model that
# converses with the operator, converges on testable intent, and drafts the spec + seed
# issue(s). The conversation runs host-side (canonical model layer directly, not the
# runner/broker), resolving its model through infra.dev.yaml's `models` registry; the API key
# comes from the environment. Omitting this block disables the wizard.
#
# sandbox_profile enables read-only codebase exploration (T4.28): because vault is an
# ESTABLISHED app, the planner provisions a fresh read-only, zero-network sandbox over the repo
# (the same `vault-toolchain` image the souls use, so gopls-backed semantic tools work) and gets
# the agent's read tools, so the specs + seed issues it drafts fit the real code. base_ref is the
# branch run.sh initializes the demo repo at. Drop sandbox_profile to fall back to a pure
# conversation. Exploration is read-only; the planner still writes nothing but the consent-gated
# spec + issues.
requirements_planner:
  model:           "deepseek/deepseek-v4-pro"
  persona:         souls/prompts/requirements-planner.md
  # Pinned to the stronger -pro tier: the wizard is the single human-in-the-loop conversation and
  # the entire correctness lever, and it must reliably follow the ledger/draft tool protocol that
  # drives the alignment ledger UI. Both deepseek tiers have a 1M-token context window, so the
  # planner can read deeply and hold a long conversation. max_tokens is the per-reply *output*
  # ceiling (not the context window): 16k leaves
  # ample room for prose + the full ledger + a complete draft (with inline spec markdown) without
  # truncating mid-block. max_tool_turns lets it explore the vault codebase across many reads;
  # turn_timeout is raised to match, so a deep exploration isn't cut short by the clock.
  max_tokens:      16384
  max_tool_turns:  40
  turn_timeout:    10m
  sandbox_profile: vault-toolchain
  base_ref:        main

dag:
  # Human entry stage: the operator authors intent in the Create-Task wizard, which seeds
  # one `plan` issue pointing at the drafted spec.
  requirements:
    kind: human

  # Decomposition (kind: plan), run by the `planner` soul. It reads the seed issue + its
  # spec and the surrounding code and breaks the feature into concrete child work items,
  # proposing each (with dependency edges) via request_subtask. Not sandbox-gated — the
  # planner writes no candidate, so it declares no postcondition; the orchestrator validates
  # the proposals (legal roles within `produces`, acyclic edges) and writes them. Breadth is
  # emergent; depth is declarative (`produces: [author-tests]`).
  plan:
    role: planner
    kind: plan
    precondition: blockers-closed
    on_failure: plan
    produces: [author-tests]

  # Writes the FAILING tests from the spec (producer != verifier: a different soul than the
  # implementor). `tests-red` proves they genuinely fail with no implementation present.
  author-tests:
    role: test-author
    precondition: blockers-closed
    postcondition: [tests-red]
    on_failure: author-tests
    produces: [implement]

  # Makes those tests pass. `tests-red-then-green` runs the acceptance tests against the
  # author-tests base (must FAIL) and the implement candidate (must PASS) in a clean sandbox.
  implement:
    role: implementor
    precondition: blockers-closed
    postcondition: [tests-red-then-green]
    on_failure: implement
    produces: [qa]

  # Spec-independent defence-in-depth, run by the `security` soul (a *different* soul than
  # the implementor). The gate re-runs the acceptance tests, the linter, and the security
  # scanners in a clean sandbox. A rejected candidate routes back to `implement`.
  qa:
    role: security
    precondition: blockers-closed
    postcondition: [tests-pass, golangci-lint, gosec, govulncheck, license-scan]
    on_failure: implement
    produces: [integrate]

  # Terminal merge to main, executed inline by the orchestrator. Autonomous profile + no
  # TCB-touching diff -> merges without human approval.
  integrate:
    kind: trusted-merge

  # Merge-conflict resolution (kind: resolve), run by the `merge-resolver` soul. Not part of
  # the linear flow: the orchestrator spawns it only when a verified candidate cannot be
  # cleanly rebased onto the current main (a sibling child landed first and they collide —
  # likely here, since sibling work items of one feature often touch the same files). It
  # rebases + resolves, then its postcondition re-runs the full qa suite on the resolved tree
  # (producer != verifier applies to the resolution too) before it can land.
  resolve:
    role: merge-resolver
    kind: resolve
    precondition: blockers-closed
    postcondition: [tests-pass, golangci-lint, gosec, govulncheck, license-scan]
    on_failure: resolve
    produces: [integrate]

# The check registry: each postcondition resolves to a shell command the gate runs in the
# clean verification sandbox (exit 0 = pass; non-zero = findings or tool error => fail
# closed). These are the VAULT APP's make targets (its Makefile travels in the seed repo).
# The reserved proofs `tests-red` / `tests-red-then-green` reuse `tests-pass` against the
# candidate and/or its base, so the acceptance tests stay a single source of truth.
checks:
  tests-pass:    make test-unit
  golangci-lint: make lint
  gosec:         make gosec
  govulncheck:   make govulncheck
  license-scan:  make license-scan

# Independent scanners the gate keeps running past a failure so one qa pass aggregates every
# finding instead of stopping at the first — better dead-letter triage (T2.12). The
# proof-shaped tests-pass stays fail-fast (no metric here to keep fail-fast). See
# specs/verification.md.
independent_checks: [golangci-lint, gosec, govulncheck, license-scan]

# Atomic feature integration (epic mode). The operator drafts a *feature* in the wizard, not a
# work item, so the feature is the unit of integration: every child integrates onto an
# `epic/<epic_id>` branch (cut from `main` when the wizard's spec is approved), `main` stays
# quiescent while the subtree builds, and the orchestrator's terminal merge advances `main`
# exactly ONCE when the epic drains. Because run.sh's push watcher keys on a `main` advance,
# that means one push to the public repo and one VPS deploy per feature — not one per child.
# v1 runs one epic at a time (a second wizard Approve is refused while the feature is in
# flight). Set `mode: per-item` (or drop the block) to land each child on `main` as it
# verifies and deploy per child. See specs/integration.md "Atomic feature integration".
integration:
  mode: epic

policy:
  max_retries: 3
  # Per-issue cumulative cap across the on_failure loop: tokens + dollars + wall. Generous
  # so a slow live run on conference wifi doesn't dead-letter, while still bounding a runaway.
  budget: { tokens: 8_000_000, usd: 10, wall: 1h }
  # Per-epic cap summed across every child of the seeded feature.
  epic_budget: { usd: 50 }
  dead_letter: harness.dlq
  # Autonomous: integrate merges hands-free (no human-approved gate, no TCB globs) since the
  # candidate is ordinary app code in a throwaway repo.
  profile: autonomous
