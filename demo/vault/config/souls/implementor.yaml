# Implementor — fulfills the `implement` role. Its worktree already holds the failing tests
# the test-author wrote; its job is to implement the feature in the vault app so they pass,
# following the app's conventions (see specs/README.md). A different soul than the
# test-author (producer != verifier). Runs in the vault-toolchain sandbox. Model resolves
# via infra.dev.yaml; key from the environment.
name:    vault-implementor
role:    implementor
model:   "deepseek/deepseek-v4-flash"
persona: souls/prompts/implementor.md
tools:   [fs, shell, git]
sandbox: vault-toolchain
# Cap per-invocation turns below the kernel default (50), same rationale as the test-author:
# fail a flailing implement attempt fast and route to its on_failure retry rather than burning
# the full default before giving up. The inherited acceptance tests + the qa gate verify the
# result independently, so the tighter cap trades only a doomed attempt's wasted minutes.
max_tool_turns: 35
