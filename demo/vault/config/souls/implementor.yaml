# Implementor — fulfills the `implement` role. Its worktree already holds the failing tests
# the test-author wrote; its job is to implement the feature in the vault app so they pass,
# following the app's conventions (see specs/README.md). A different soul than the
# test-author (producer != verifier). Runs in the vault-toolchain sandbox. Model resolves
# via infra.dev.yaml; key from the environment.
# `explore` opts this soul into the distilled-comprehension helper (Phase 12): implementing a
# vertical slice means first localizing where the store/web/view layers hook together, so a cheap
# read-only sub-loop that hands back grounded file:line anchors keeps that navigation out of the
# implementor's own context (specs/components/agent.md "Explore"). Offered only because
# policy.explore_budget is set AND this list names `explore`.
name:    vault-implementor
role:    implementor
model:   "anthropic/claude-sonnet-5"
persona: souls/prompts/implementor.md
tools:   [fs, shell, git, explore]
sandbox: vault-toolchain
# Cap per-invocation turns at the kernel default (50), matching the test-author. Implementing a
# 4-layer vertical slice (store+web+views) and getting it green through the qa gate is as turn-
# heavy as authoring the tests for it, so the earlier 35 risked starving a healthy attempt the
# same way it did the test-author (a live run reached a valid red ~7 turns short of submitting).
# The inherited acceptance tests + the qa gate still verify the result independently, and the
# per-issue wall/budget caps remain the real backstop against a genuine flail.
max_tool_turns: 50
