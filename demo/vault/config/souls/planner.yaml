# Decomposition planner — fulfills the `plan` role. Reads the seeded feature spec and the
# surrounding vault code and breaks the work into concrete child work items, proposing each
# (with dependency edges) via request_subtask, then submit_plan. Writes no code/tests; the
# children flow on through author-tests -> implement -> qa -> integrate. Not sandbox-gated,
# but still untrusted — it runs in the zero-network vault-toolchain sandbox and its proposals
# are validated, not trusted. Model resolves via infra.dev.yaml; key from the environment.
#
# Runs on anthropic/claude-opus-4.8 (with the test-author), the most capable tier — not the Sonnet the
# wizard and execution souls use: decomposition is a once-per-seed, high-leverage judgement call —
# a wrong split wastes every test-author/implementor/security soul downstream of it — and it
# demands holding the whole spec + surrounding code in head at once. Because it names the Opus
# slug, a MODEL= override (which only rewrites the shared Sonnet slug) swaps the execution souls
# without downgrading the planner.
# `explore` opts this soul into the distilled-comprehension helper (Phase 12): decomposition
# reads broadly across the vault codebase to find the natural seams, so localizing via a cheap
# read-only sub-loop (and getting back grounded anchors) instead of spending its own Opus context
# navigating is exactly its beneficiary case (specs/components/agent.md "Explore"). The tool is
# offered only because policy.explore_budget is set AND this list names `explore`.
name:    vault-planner
role:    planner
model:   "anthropic/claude-opus-4.8"
persona: souls/prompts/planner.md
tools:   [fs, shell, git, explore]
sandbox: vault-toolchain
