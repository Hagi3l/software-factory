# Security/QA reviewer — fulfills the `qa` role. A *different* soul than the implementor
# (producer != verifier): handed the implementor's candidate as its base, it subjects it to
# the spec-independent defence-in-depth pass — SAST (gosec), known-vulnerability scan
# (govulncheck), dependency/licence policy (license-scan) — hardening what it can without
# ever weakening the inherited acceptance tests. It is NOT the gate: the authoritative gate
# re-runs every postcondition in a clean sandbox, so this soul never self-certifies; a
# rejected candidate routes back to `implement`. Especially apt for a secrets vault, where
# the scanners re-audit the crypto/auth code. Runs in the vault-toolchain sandbox. Model
# resolves via infra.dev.yaml; key from the environment.
#
# N-version note: this soul runs on deepseek-v4-pro — a different model FAMILY than every
# Anthropic producer — so the producer≠verifier independence verification.md recommends is
# real: a bug must slip past two independently-trained judgments. This was the config edit
# the old advisory asked for; `harness validate` is now family-clean. Also the cheap slot:
# the soul's value-add is scanner-driven remediation whose output is re-gated
# deterministically, so a cheaper model degrades polish, never the gate's floor.
#
# explore: enabled, on the same shared vault-explorer the producers use — a deliberate,
# spec-recorded choice (specs/verification.md): explore is additive and never load-bearing,
# so a shared explorer can degrade this soul's *search*, never the gate's *grade* (the
# scanners and re-run postconditions are deterministic). Drop `explore` from tools to
# read raw instead — the stricter posture.
name:    vault-security
role:    security
model:   "deepseek/deepseek-v4-pro"
persona: souls/prompts/security.md
tools:   [fs, shell, git, explore]
sandbox: vault-toolchain
