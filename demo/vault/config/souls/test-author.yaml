# Test author — fulfills the `author-tests` role. Turns a child work item's spec into
# FAILING Go tests against the existing vault code, then submits for independent
# verification. A *different* soul than the implementor (producer != verifier): it never
# sees the implementation, and a separate soul makes its tests pass. Runs in the
# vault-toolchain sandbox. Model resolves via infra.dev.yaml; key from the environment.
#
# Runs on anthropic/claude-opus-4.8 (with the decomposition planner), the most capable tier — not the
# Sonnet the wizard and execution souls use: the acceptance tests are the spec made executable —
# the contract the whole factory trusts in place of a human reviewer, and the ceiling on what
# the implementor can produce (it must satisfy these tests and may never weaken them). A test
# that misreads the spec makes a smart implementor faithfully build the wrong thing, so this
# role defines correctness and must be reliable. Names the Opus slug, so a MODEL= override
# (which only rewrites the shared Sonnet slug) swaps the execution souls without downgrading it.
# `explore` opts this soul into the distilled-comprehension helper (Phase 12), like the planner and
# implementor. Writing acceptance tests for a vertical slice means first localizing the seams the
# tests must pin (the store schema, the handler signatures, where audit entries are appended) — and
# this is the demo's proven token hog: a live run had the test-author navigating the vault raw for
# ~1.3M tokens in its own Opus context. Delegating that search->read->refine to the cheap read-only
# explorer sub-loop (grounded file:line anchors back) keeps it out of the Opus context, exactly the
# beneficiary case. Its output is still independently gated (tests-red + compiles), so a weak
# explorer costs at worst a re-search, never a bad contract. Offered only because
# policy.explore_budget is set AND this list names `explore`.
name:    vault-test-author
role:    test-author
model:   "anthropic/claude-opus-4.8"
persona: souls/prompts/test-author.md
tools:   [fs, shell, git, explore]
sandbox: vault-toolchain
# Cap per-invocation turns. The kernel default is 50; a healthy author-tests run on this
# codebase reaches a valid red in ~30 turns. An earlier cap of 35 proved too tight: a live
# run had a compiling, genuinely-red tree by turn ~28, then over-built (extra store-level
# tests, an accidental deletion it had to repair) and ran out before it could submit — cut
# off ~7 turns from done. Raised to 50 (the kernel default): the `compiles` postcondition
# makes this role scaffold a 4-layer vertical slice (store+web+views) on top of the tests, so
# a legitimately deep run needs the room. Pair with the persona's "submit as soon as the tree
# compiles and the new tests fail" rule so the headroom buys completion, not more wandering.
# The gate still independently verifies tests-red/compiles, so correctness is unaffected.
max_tool_turns: 50
