# Vault demo infrastructure overlay (env: dev) — points the factory at Anthropic models served
# through OpenRouter's OpenAI-compatible endpoint. See demo/vault/README.md.
#
# The model call is made by the runner on the HOST (the trusted side holds the adapter +
# the API key), NOT from inside the sandbox — the agent only emits a canonical request and
# the runner calls OpenRouter. So `openrouter.ai` is reached from the host and the sandbox
# stays zero-network. run.sh requires OPENAI_API_KEY to hold your OpenRouter key (the
# openai-compat adapter sends it as the bearer token). The requirements-planner (the wizard)
# reaches the same endpoint host-side via the canonical model layer.
sandbox:
  backend: docker
  egress:  broker-only
  # `wall` bounds the WHOLE invocation including time the runner waits on inference. A full
  # Go build + the gate scanners take real time, so keep it generous on demo hardware.
  #
  # These are PER-SANDBOX caps. The orchestrator has no global concurrency throttle
  # (scheduleReady dispatches every ready issue), so on a fan-out the runner can hold several
  # sandboxes at once — peak concurrency = the widest set of unblocked sibling children.
  #   - cpu: overcommit is safe (the kernel time-slices), so 6 gives a single gate more parallel
  #     compile/test throughput while a 2-wide burst just shares cores. Go build/test and the
  #     scanners parallelize well.
  #   - mem: a HARD wall — if (peak concurrent sandboxes x mem) exceeds the Docker VM's RAM, the
  #     VM OOM-kills gates. On an 8Gi VM, 4Gi holds ~1 heavy gate with headroom or 2 at the edge;
  #     if epics fan out wider, either lower this, give the VM more RAM, or let the planner's
  #     dependency edges serialize the siblings. The warmed GOCACHE (see Dockerfile) cuts peak
  #     gate memory too, since fewer packages compile from cold.
  # wall: 18m. Lowered from the shipped 30m for the live demo (30m == the whole demo budget, so
  # one stalled sandbox could silently eat the window before the watchdog fired), but NOT to 12m:
  # an observed *healthy* deep test-author run took ~19m of wall, so a 12m cap wall-killed a
  # legitimate attempt and then handed its retry even less of the per-issue budget — a guaranteed
  # second death that doubled token burn before dead-lettering. 18m covers the healthy deep run
  # with headroom while still fast-failing a genuinely hung sandbox. The two-breakpoint prompt
  # caching (specs/models.md) also cuts per-turn latency, so 18m buys more turns than 12m did.
  # AckWait (the redelivery lease) defaults to this, so a dead runner redelivers after it.
  limits:  { cpu: 6, mem: 4Gi, wall: 18m }
  # max_concurrency: how many invocations the runner serves PER ROLE at once. The shipped default
  # is 1 (serial), which serializes same-role siblings: in a 4-child epic the four author-tests
  # invocations run back-to-back, the dominant wall-time cost on a live run. Setting 2 lets two
  # siblings of a role run concurrently (~2x on the agent stages), bounded by RAM: each sandbox
  # may use up to `mem` (4Gi), so on an ~8Gi VM keep this at 2 (2x4Gi leaves headroom for the
  # orchestrator's separate gate sandbox); raise it only with more RAM or a lower mem. The
  # orchestrator's verification gates stay serial (single result consumer), so this speeds the
  # author/implement agent stages, not the gate re-runs.
  max_concurrency: 2
  # Resolves the logical profile each soul names (soul.sandbox: vault-toolchain) to the
  # concrete image the docker backend boots. run.sh builds it locally tagged
  # `vault-toolchain` (from demo/vault/Dockerfile), so the profile maps to that bare tag.
  profiles:
    vault-toolchain:
      image: vault-toolchain
nats:
  # empty url -> in-process embedded NATS (the dev shape). The live SSE feed and the wizard
  # are co-located in `software-factory run --serve-addr`.
  url: ""
  jetstream: { replicas: 1, max_age: 168h }
broker:
  allowlist: [llm-api, nats, git]
artifacts:
  backend: files
  path: ./.software-factory/artifacts
otel:
  endpoint: ""        # tracing off for the demo ("stdout" to see spans, host:port for OTLP)
models:
  # Every soul references one of these two registry keys by its `model:` field; the key is
  # sent verbatim as the request's model id. All roles run on Anthropic models via OpenRouter
  # (one OPENAI_API_KEY, held host-side by the runner; the sandbox stays zero-network). Two tiers:
  #
  #   - anthropic/claude-opus-4.8 for the two roles that define *what correct means* and gate
  #     everything below them: the decomposition planner (`plan`) and the test-author
  #     (`author-tests`). A wrong split, or a misread test contract, wastes every soul under it —
  #     so they get the most capable model.
  #   - anthropic/claude-sonnet-5 for the rest of the producer path — the requirements-planner
  #     (the wizard, interactive, so latency matters), the implementor, and the
  #     merge-resolver. Near-Opus quality on coding/agentic work at Sonnet cost — a good fit now
  #     that the implementor also designs the store/view layers. MODEL= rewrites this shared
  #     Sonnet slug across those roles without touching the pinned Opus roles (see run.sh).
  #   - z-ai/glm-5.2 for the security/qa verifier — a different model FAMILY (Zhipu GLM) than
  #     every producer (real N-version diversity, see its entry below) at a fraction of the cost.
  #
  # The keys are OpenRouter slugs, sent verbatim as the request's model id; the openai-compat
  # adapter posts them to OpenRouter with OPENAI_API_KEY as the bearer token. Effort rides as
  # OpenRouter's top-level `verbosity` field (`effort_param: verbosity`), which is what Claude
  # 4.6+/5 map to output_config.effort (their `reasoning.effort` is a silent no-op, so
  # effort_param picks the field that actually lands). The Opus entry PINS `effort: high` —
  # the correctness-defining tier runs at full deliberation by declaration, not by trusting the
  # provider default — and the Sonnet-5 entry sets `effort: medium` to trim deliberation and
  # cost on the execution tier. `prompt_caching: true` opts the Anthropic entries into caching:
  # the adapter marks the re-sent stable prefix (persona + Brief) cacheable so OpenRouter forwards
  # the breakpoint to Anthropic and bills re-sent tokens at the cache-read rate — the single
  # largest cost saving on the agent loop, whose every turn re-sends that prefix. cost is the
  # per-million-token price feeding the policy.budget USD accounting — roughly the Anthropic list
  # price OpenRouter passes through, now including the cache-write (~1.25x input) and cache-read
  # (~0.1x input) rates so a cached run's USD figure is accurate rather than undercounted.
  "anthropic/claude-opus-4.8":
    provider: openai-compat
    endpoint: https://openrouter.ai/api/v1
    prompt_caching: true
    effort: high
    effort_param: verbosity
    cost: { input_per_mtok: 5, output_per_mtok: 25, cache_write_per_mtok: 6.25, cache_read_per_mtok: 0.5 }
    idle_timeout: 90s   # abort+retry a stream silent for 90s (a hung upstream); inter-chunk, not total
  "anthropic/claude-sonnet-5":
    provider: openai-compat
    endpoint: https://openrouter.ai/api/v1
    prompt_caching: true
    effort: medium
    effort_param: verbosity
    cost: { input_per_mtok: 2, output_per_mtok: 10, cache_write_per_mtok: 2.5, cache_read_per_mtok: 0.2 }
    idle_timeout: 90s
  # z-ai/glm-5.2 is the DIVERSE verifier tier: the security/qa soul runs on a different model
  # FAMILY (Zhipu GLM) than the Anthropic producers, so the N-version producer!=verifier
  # independence verification.md recommends is real rather than advisory — a bug now has to slip
  # past two independently-trained judgments (and the T2.13 family-overlap advisory is silenced by
  # FIXING it, not muting it). It is also a cheap tier where cheap is safe: the qa soul's value-add
  # is scanner-driven remediation whose output is re-gated deterministically, and at ~$0.91/$2.86
  # per Mtok it is still well under the Sonnet slot it replaces. 1M context + tools, same host-side
  # OpenRouter path and key as the others. NO `prompt_caching`: GLM auto-caches server-side without
  # cache_control markers (a marker is sent only where a backend both needs AND accepts it —
  # specs/models.md); its cached reads still arrive in usage and are priced by cache_read below
  # (~0.19x input; auto-caching has no write premium, so no cache_write rate).
  # effort: medium trims the verifier's deliberation (and wall-time/output tokens) — the
  # deepseek predecessor ran at high and produced a slow ~30m gate, so medium is the deliberate
  # latency/depth trade for the live demo; the gate's real floor is the deterministic scanners +
  # re-run postconditions, not the model's reasoning depth, so a lighter effort degrades polish,
  # never the gate itself. GLM reads the unified reasoning:{effort} wire form (supported_parameters
  # lists reasoning + reasoning_effort), so effort_param: reasoning (NOT verbosity, the Claude-4.6+/5
  # form). Flip back to high if verifier depth matters more than latency. Slug + pricing verified
  # live against OpenRouter /api/v1/models 2026-07-07.
  "z-ai/glm-5.2":
    provider: openai-compat
    endpoint: https://openrouter.ai/api/v1
    effort: medium
    effort_param: reasoning
    cost: { input_per_mtok: 0.9086, output_per_mtok: 2.8556, cache_read_per_mtok: 0.16874 }
    idle_timeout: 90s
  # anthropic/claude-haiku-4.5 is the CHEAP tier the explore tool's read-only helper soul runs on
  # (Phase 12, T12.6). explore delegates broad search->read->refine localization to a nested
  # sub-loop on this model so the frontier producer never spends its own context navigating; the
  # sub-loop returns *checkable* anchors an already-untrusted, independently-gated parent re-reads,
  # so a weak model there costs at worst a re-search, never a bad merge (specs/models.md "Helper
  # souls"). Same OpenRouter openai-compat path + prompt caching as the others; cost feeds the
  # policy.budget / explore_budget USD accounting at roughly Haiku list price.
  "anthropic/claude-haiku-4.5":
    provider: openai-compat
    endpoint: https://openrouter.ai/api/v1
    prompt_caching: true
    cost: { input_per_mtok: 1, output_per_mtok: 5, cache_write_per_mtok: 1.25, cache_read_per_mtok: 0.1 }
    idle_timeout: 90s
