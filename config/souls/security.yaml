# The Go security/QA reviewer: the soul that fulfills the `qa` DAG role. It is a
# *different* soul than the implementor (producer != verifier): it is handed the
# implementor's candidate as its base and subjects it to the spec-independent
# defence-in-depth pass — SAST (gosec), known-vulnerability scan (govulncheck),
# dependency/licence policy (license-scan), and test-adequacy (mutation) — hardening
# what it can without ever weakening the acceptance-test contract it inherited.
#
# It is *not* the gate. The authoritative gate re-runs every postcondition in a clean
# orchestrator-controlled verification sandbox (producer != verifier), so this agent
# never self-certifies — its candidate is a proposal the independent gate grades, and a
# rejected one routes back to `implement` (see specs/verification.md, specs/workflow.md).
#
# It runs in the same `go-toolchain` sandbox profile as the implementor — the qa
# scanners and the mutation tool are baked into that role's image so they run offline
# under the zero-network invariant (see deploy/go-toolchain.Dockerfile, T5.3/T5.6). The
# model resolves through infra.<env>.yaml's `models` registry; the API key is supplied
# from the environment by the runner, never from this file.
#
# Model tier (T3.4): this soul runs a *mid*-tier model (claude-sonnet-4-6), not the
# frontier model the planner/test-author/implementor use. This is the lowest-risk place
# to economize: unlike those roles, every byte this soul produces is re-graded by the
# independent gate in a clean verification sandbox (all scanners + mutation + the
# red→green proof re-run), and a rejected candidate routes back to `implement`. Because
# producer != verifier already catches its mistakes, a cheaper model here trades little
# safety for real cost savings. Tune per deployment (see specs/models.md, configuration.md).
#
# N-version diversity (T2.13): this verifier still resolves to the same *provider*
# (anthropic) as the implementor, just a cheaper tier — so `software-factory validate` emits a
# non-fatal advisory that producer and verifier share a model family (correlated blind
# spots). The bootstrap accepts this knowingly: anthropic is the only provider wired in
# dev. Pointing this soul at a different-family model (e.g. an openai-compat local model)
# is the recommended hardening once a second family is available; it is a config edit
# here, never a code change (see specs/verification.md, "Model diversity is configured").
name:    security-go
role:    security
model:   claude-sonnet-4-6
persona: souls/prompts/security.md
tools:   [fs, shell, git]
sandbox: go-toolchain
selector: { lang: go }
