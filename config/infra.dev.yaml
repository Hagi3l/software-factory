# Development infrastructure overlay (env: dev).
#
# Docker stands in for Firecracker in the bootstrap (sandbox.md / bootstrap.md); the
# sandbox is zero-network ("broker-only" egress), so every model call, git push, and
# event the agent makes is mediated by the runner's broker against the allowlist
# below. NATS is the in-process embedded server (location transparency — the same
# code distributes later by pointing `url` at an external cluster). API keys come
# from the environment / secret store, NEVER from this file.
sandbox:
  backend: docker
  egress:  broker-only
  limits:  { cpu: 2, mem: 2Gi, wall: 30m }
  # profiles resolves the logical profile a soul names (soul.sandbox: go-toolchain) to the
  # concrete artifact this backend boots — an `image` for docker/gvisor, a `rootfs` for
  # firecracker. The producer and its independent verifier resolve the *same* profile, so
  # the gate grades on the producer's toolchain (producer != verifier, same toolchain). Pin
  # by digest in production so provenance records the exact toolchain bytes; the dev tag here
  # is built by `deploy/go-toolchain.Dockerfile` (T5.3/T5.6). software-factory validate fails if any
  # soul.sandbox has no entry here for the active backend. See specs/components/sandbox.md.
  profiles:
    go-toolchain:
      image: factory/go-toolchain:dev
nats:
  # url empty -> the in-process embedded NATS server (the bootstrap/dev shape; expose it on a
  # TCP listener for `software-factory approve` with `software-factory run --nats-addr host:port`). Point url at
  # an external cluster (e.g. nats://nats-1:4222,nats://nats-2:4222) to run distributed (T5.8)
  # — same code, no rebuild (location transparency). When url is set the embedded server is
  # NOT started and --nats-addr is ignored.
  url: ""
  # replicas is the JetStream replication factor applied to every stream; 1 is the only valid
  # value on the single embedded server, >1 needs an external cluster of at least that size.
  # max_age bounds how long the result stream retains envelopes for the orchestrator to
  # consume + replay (the work/dlq/approvals streams are deliberately unbounded).
  jetstream: { replicas: 1, max_age: 168h }
broker:
  # The egress allowlist: the only destinations the runner brokers for the zero-network
  # sandbox (deny-by-default). package-proxy permits Go module fetches — routed through the
  # in-sandbox GOPROXY shim to the runner, which fetches from package_proxy and logs every
  # pull (T5.6). Supply-chain integrity is go.sum + the public checksum DB (pinning), broker
  # logging, and the qa gate's post-fetch govulncheck/license scan — so the public proxy is
  # the deliberate default, not a private vetted mirror (an optional swap). See specs/security.md.
  allowlist: [llm-api, nats, git, package-proxy]
  package_proxy: https://proxy.golang.org
# git: where the candidate branch is pushed and how that push is authenticated (T5.7).
# Empty (the dev default) keeps the bootstrap local-repo apply: the runner lands the
# candidate branch into the local source repo, no token — the single-host shape. A
# distributed deployment sets `remote` to a real git remote and `github_app` to mint a
# per-task, short-lived push token. The token scopes to the repo with contents:write (a
# GitHub App installation token can't scope to a branch — the runner's broker branch guard
# enforces "only the task branch"); it is minted just before the push and revoked the
# instant it's done, dying with the invocation. The App private key is a runtime secret
# referenced by PATH, NEVER committed or baked into an image (the API-key posture); its
# existence is not checked at validate time. `git` must stay in broker.allowlist for any
# push to be brokered. See specs/security.md Control 3, specs/components/runner.md.
# git:
#   remote: https://github.com/acme/widgets.git
#   github_app:
#     app_id: "123456"
#     installation_id: "7891011"
#     repository: acme/widgets
#     private_key: /run/secrets/factory_github_app.pem
artifacts:
  backend: files
  path: ./.software-factory/artifacts
otel:
  endpoint: localhost:4317
# signing: provenance-commit signing (T5.10). Disabled in dev — commits land unsigned, as
# they always have. To turn it on, supply the factory's SSH signing key (a runtime secret,
# NEVER committed or baked into an image) and an allowed-signers file for verify-on-read; the
# control room's provenance view then shows each merged commit's signature verdict. The same
# code signs in production by pointing `key` at a secret-manager/ssh-agent-delivered key.
# signing:
#   enabled: true
#   key: /run/secrets/factory_ed25519
#   allowed_signers: /etc/factory/allowed_signers
models:
  # Per-role model tiers (T3.4): a soul names its model here; the runner resolves it per
  # invocation, so cheaper models can serve roles whose output is independently re-gated.
  #
  # `cost` is the per-million-token price (T3.8): the table the orchestrator uses to convert
  # an invocation's recorded token usage into USD so it can enforce the cumulative per-issue
  # dollar budget (policy.budget.usd) that bounds the on_failure loop — the budget half of the
  # termination guarantee. Prices are not secrets (unlike API keys, which never live in
  # config), so they sit here in the model registry; they track the published vendor sheet and
  # are tuned per deployment. A model with no `cost` block contributes $0 (its spend is still
  # bounded by the token and retry caps). See specs/workflow.md, specs/models.md.
  #
  # === Provider / subscription selection ===
  # Anthropic: set ANTHROPIC_API_KEY; souls use claude-* models (default).
  # Grok/xAI: set OPENAI_API_KEY (or XAI_API_KEY) to your xAI key; change soul model: fields
  # to grok-4.5 / grok-4-fast. Endpoint is already set for openai-compat.
  # See docs/selecting-provider.md for details.
  claude-opus-4-8:   # frontier — planner, test-author, implementor
    provider: anthropic
    cost: { input_per_mtok: 5, output_per_mtok: 25, cache_write_per_mtok: 6.25, cache_read_per_mtok: 0.5 }
  claude-sonnet-4-6: # mid tier — security/qa (candidate re-gated)
    provider: anthropic
    cost: { input_per_mtok: 3, output_per_mtok: 15, cache_write_per_mtok: 3.75, cache_read_per_mtok: 0.3 }
  # Grok / xAI models (OpenAI-compatible). Switch soul model: to these for Grok.
  # Costs are approximate — update from https://x.ai/api pricing.
  grok-4.5:          # frontier — planner, test-author, implementor
    provider: openai-compat
    endpoint: https://api.x.ai/v1
    family: xai
    cost: { input_per_mtok: 0.20, output_per_mtok: 0.50 }
  grok-4-fast:       # mid/fast tier — security/qa or cost-sensitive
    provider: openai-compat
    endpoint: https://api.x.ai/v1
    family: xai
    cost: { input_per_mtok: 0.20, output_per_mtok: 0.50 }
