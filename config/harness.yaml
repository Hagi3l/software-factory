# Bootstrap workflow (the kernel DAG).
#
# Why this shape: bootstrap.md collapses the full requirements -> plan ->
# author-tests -> implement -> qa -> integrate pipeline down to
# implement -> integrate for the self-host point. The human performs `plan` by
# authoring specs and seeding one issue at the `implement` stage; the implementor
# writes its own tests until the independent `author-tests` stage lands (Phase 2).
# `integrate` is a trusted-merge executed inline by the orchestrator (never
# dispatched to a runner), which is the terminal merge-to-main state.
#
# `on_failure: implement` routes a rejected candidate back through a fresh implement
# attempt (a new issue, keeping the issue graph acyclic); `max_retries` bounds how
# many such cycles run before the work dead-letters for human triage — the primary
# termination guarantee.
dag:
  implement:
    role: implementor
    precondition: blockers-closed
    postcondition: [tests-pass]
    on_failure: implement
    produces: [integrate]
  integrate:
    kind: trusted-merge

# The check registry: each command-check postcondition declared above resolves to the
# shell command the gate runs in the clean verification sandbox (exit 0 = pass). These
# are the harness's own make targets — `make test-unit` compiles every package (so a
# build break also fails the gate) and runs the unit suite. Keeping the commands here
# (not as flags or code) makes config the single source of truth the gate resolves
# against; see specs/configuration.md.
checks:
  tests-pass: make test-unit

policy:
  max_retries: 3
  budget: { tokens: 2_000_000, usd: 20, wall: 2h }   # per issue
  dead_letter: harness.dlq
