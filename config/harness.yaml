# Bootstrap workflow (the kernel DAG).
#
# Why this shape: the full requirements -> plan -> author-tests -> implement -> qa ->
# integrate pipeline. `requirements` stays human (a person authors specs and seeds one
# `plan` issue, the first autonomous stage). As of T3.1 `plan` is its own live stage:
# the seed enters there, not at `author-tests`. As of T2.9 `qa` is its own live stage
# between `implement` and `integrate` (it was previously folded into the implement gate).
#
# `plan` is the decomposition stage (kind: plan), run by the `planner` soul. It reads the
# seed issue + its spec and breaks the work into concrete child work items, proposing each
# (with dependency edges) via request_subtask. It is an agent stage but is NOT
# sandbox-gated: the planner writes no candidate, so it declares no postcondition; its
# output is the proposals, which the orchestrator validates (legal roles within the
# declared `produces`, acyclic edges) and writes. Breadth is emergent (the planner decides
# how many children); depth is declarative (`produces: [author-tests]` fixes that each
# child enters at author-tests). A plan that proposes nothing routes `on_failure` for a
# fresh attempt. See specs/workflow.md, specs/configuration.md.
#
# `author-tests` writes the FAILING acceptance tests from the spec (producer != verifier:
# a different soul than the implementor). Its `tests-red` postcondition proves the tests
# genuinely fail with no implementation present — a vacuous or non-compiling suite is
# rejected before an implement attempt is ever spent on it. On success it `produces` an
# `implement` issue whose candidate branches from the author-tests candidate (the
# orchestrator threads the verified branch as the new issue's base), so the implementor
# inherits the failing tests and only has to make them pass.
#
# `implement` makes those tests pass; its `tests-red-then-green` postcondition grades the
# candidate in the clean verification sandbox by running the acceptance tests against two
# refs: they must FAIL on the issue's base — the author-tests candidate that holds the
# failing tests but no implementation (the orchestrator threads that branch as the gate's
# base ref) — and PASS on the implement candidate. This proves the implementation actually
# turned the tests green rather than the tests being vacuous. On success it `produces` a
# `qa` issue (the orchestrator threads the implement candidate as its base).
#
# `qa` is the spec-independent defence-in-depth stage, run by the `security` soul — a
# *different* soul than the implementor (producer != verifier). Its gate re-runs the
# acceptance tests, a static lint (golangci-lint), a mutation-adequacy metric, and three
# spec-independent scanners (gosec SAST, govulncheck known-vulnerabilities, license-scan
# dependency/licence policy) in the clean verification sandbox. The lint is the SAME `make
# lint` the implementor runs in-loop for fast feedback — one command, run by the agent for
# speed and re-run by the gate for trust (a producer self-check grants zero trust; only the
# gate's re-run advances the transition; see specs/verification.md "Producer self-checks are
# feedback, not grades"). mutation>=0.8 is the kernel default mutation
# threshold (see specs/verification.md). A rejected qa candidate routes `on_failure` back
# to `implement` — a fresh fix attempt — so a finding is fixed by the implementor and
# re-gated, not merged. `integrate` is a trusted-merge executed inline by the orchestrator
# (never dispatched to a runner), the terminal merge-to-main state.
#
# `on_failure` routes a rejected candidate back through a fresh attempt of a stage (a new
# issue, keeping the issue graph acyclic); `max_retries` bounds how many such cycles run
# before the work dead-letters for human triage — the primary termination guarantee.

# Spec context horizon (T3.5): the orchestrator hands each agent the bounded spec slice —
# the issue's referenced spec file plus its cross-linked neighbours within this many link
# hops — rather than the whole specs/ tree. 1 = the referenced file plus its direct
# neighbours (enough to carry a contract and the terms it leans on); see specs/specs-process.md.
spec_depth: 1

# Ambient specs (T3.14): repo-relative spec files injected into EVERY agent's Brief regardless of
# the issue — for a project's cross-cutting conventions/gotchas and its spec index, which the
# issue-scoped slice does not reliably carry. Prepended ahead of the bounded slice (a stable,
# cache-friendly prefix), de-duplicated against it, and covered by the spec content hash (so a
# conventions edit is pinned and re-derives work like a contract edit). Opt-in (empty default);
# keep them LEAN — they ride in every invocation. Conventional pair shown below. This harness's
# own conventions live in CLAUDE.md (invisible to agents); a specs/conventions.md would be needed
# to self-host, so the shipped config leaves this empty. See specs/specs-process.md "Ambient specs".
# ambient_specs: [specs/README.md, specs/conventions.md]

# The requirements planner (T4.12): the trusted, NON-sandboxed LLM behind the control-room
# Create-Task wizard. It is the one place a human is in the loop — a steered conversation
# that converges on testable intent (and, later T4.14, drafts specs + seed issues). It runs
# no untrusted code, so it sits correctly outside the sandbox and reuses the canonical model
# layer directly, not the runner/broker. Its model resolves through infra.<env>.yaml's
# `models` registry like a soul's; the API key comes from the environment, never config. The
# wizard is co-located in `harness run --serve-addr` (it shares no NATS — the model call is a
# direct trusted adapter call), so a standalone `harness serve` shows it disabled. Omitting
# this whole block disables the wizard. See specs/control-room.md, specs/workflow.md.
requirements_planner:
  model:      claude-opus-4-8
  persona:    souls/prompts/requirements-planner.md
  max_tokens: 4096

dag:
  requirements:
    kind: human
  plan:
    role: planner
    kind: plan
    precondition: blockers-closed
    on_failure: plan
    produces: [author-tests]
  author-tests:
    role: test-author
    precondition: blockers-closed
    postcondition: [tests-red]
    on_failure: author-tests
    produces: [implement]
  implement:
    role: implementor
    precondition: blockers-closed
    postcondition: [tests-red-then-green]
    on_failure: implement
    produces: [qa]
  qa:
    role: security
    precondition: blockers-closed
    postcondition: [tests-pass, golangci-lint, "mutation>=0.8", gosec, govulncheck, license-scan]
    on_failure: implement
    produces: [integrate]
  integrate:
    kind: trusted-merge
    # The human-approval gate (T2.10): under policy.profile trusted-dev (below) every
    # integrate must be approved by a human before it lands — the self-hosting transition
    # where the harness writes code and a person reviews every diff. The orchestrator (not
    # the sandbox gate) evaluates it: a verified candidate is PARKED awaiting `harness
    # approve <issue>` (denied by `harness reject <issue>`), bound to the candidate sha so a
    # stale approval is invalidated. See specs/configuration.md, specs/bootstrap.md.
    postcondition: [human-approved]
  # `resolve` is the merge-conflict-resolution stage (kind: resolve), run by the
  # `merge-resolver` soul. It is NOT part of the linear flow and no stage `produces` it:
  # the orchestrator spawns a resolve issue only when a verified candidate cannot be
  # cleanly rebased onto the current main (another candidate landed first and they
  # textually collide). The resolver is seeded at the conflicting candidate, rebases it
  # onto main and resolves the conflicts, and submits a new candidate. Unlike `plan` it IS
  # gated: its postcondition re-runs the full qa suite (the same checks that gate qa) so
  # the *resolved* tree is independently re-verified in a clean sandbox before it can land
  # — the two-green-branches guard applies to the resolution too (producer != verifier).
  # On success it `produces: [integrate]`, looping back into the merge queue onto whatever
  # main has since become; `on_failure: resolve` retries the resolution, bounded by
  # `max_retries` and the budget so a conflict no rebase resolves eventually dead-letters.
  # See specs/integration.md.
  resolve:
    role: merge-resolver
    kind: resolve
    precondition: blockers-closed
    postcondition: [tests-pass, golangci-lint, "mutation>=0.8", gosec, govulncheck, license-scan]
    on_failure: resolve
    produces: [integrate]

# The check registry: each command-check postcondition resolves to the shell command the
# gate runs in the clean verification sandbox (exit 0 = pass; non-zero = findings or a
# tool error => fail, closed). These are the harness's own make targets, so "how the
# harness runs its QA" lives in one reviewable place (the Makefile) — `make test-unit`
# compiles every package (a build break also fails the gate) and runs the unit suite;
# `make lint` runs golangci-lint (configured by .golangci.yml, which travels in the
# worktree); `make gosec`/`govulncheck`/`license-scan` are the spec-independent scanners;
# `make mutation` prints the mutation score the `mutation>=0.8` comparison grades (the gate
# reads the trailing numeric token of stdout and fails closed if it cannot).
#
# The reserved proofs `tests-red` (author-tests) and `tests-red-then-green` (implement)
# have no command of their own: they reuse `tests-pass`, run against the candidate and/or
# its base (the implement red→green proof runs it against both), so the acceptance tests
# stay a single source of truth. The `mutation` comparison resolves the command registered
# under its metric name (`mutation`). Keeping the commands here (not as flags or code)
# makes config the single source of truth the gate resolves against; see
# specs/configuration.md.
#
# Offline note: the qa scanners, the linter, and the mutation tool run under the
# zero-network invariant, so they are baked into the go-toolchain sandbox image (T5.3,
# deploy/go-toolchain.Dockerfile): golangci-lint, gosec, go-licenses, and gremlins are
# binary-only static analysers / test drivers; govulncheck additionally reads an offline
# copy of the Go vulnerability database baked under /opt/harness/vulndb (the image sets
# GOVULNDB, which `make govulncheck` passes via `-db`). The image digest pinned in
# provenance therefore also pins the gate-tool and vuln-DB versions a verdict was graded
# against. The qa gate is fully live once that image is the resolved profile artifact.
checks:
  tests-pass:    make test-unit
  golangci-lint: make lint
  gosec:         make gosec
  govulncheck:   make govulncheck
  license-scan:  make license-scan
  mutation:      make mutation

# Independent scanners the gate keeps running PAST a failure, so one qa pass aggregates
# every finding (e.g. a gosec hit AND a govulncheck hit AND a licence violation) instead of
# stopping at the first — the human/agent triaging the dead-letter queue fixes them all in
# one round-trip rather than bouncing the candidate once per scanner (T2.12). These are the
# spec-independent command checks, safe to continue past because their findings don't make
# each other meaningless. The proofs (tests-pass) and the metric (mutation>=0.8) are
# deliberately NOT listed: they stay fail-fast — a mutation score on a candidate whose tests
# are red is meaningless, so there is no point measuring it. See specs/verification.md.
independent_checks: [golangci-lint, gosec, govulncheck, license-scan]

policy:
  max_retries: 3
  # Per-issue cumulative cap across the on_failure loop: tokens + dollars + wall-clock. The
  # wall here is the CROSS-LOOP wall (sum of each attempt's elapsed), distinct from the
  # per-invocation sandbox ceiling in infra.<env>.yaml. Any zero/omitted dimension is uncapped.
  budget: { tokens: 2_000_000, usd: 20, wall: 2h }   # per issue
  # Per-epic cumulative cap, enforced as an aggregate read over every issue sharing an epic_id
  # (the root seed's id, threaded forward like the candidate base). An epic fans out, so its
  # total cannot be a threaded counter without double-counting the shared prefix — the
  # orchestrator sums each issue's own-invocation spend instead (T3.8b, specs/workflow.md). Only
  # tokens/USD apply at epic scope; wall is per-issue above.
  epic_budget: { usd: 200 }
  dead_letter: harness.dlq
  # Autonomy profile (T2.10). The bootstrap self-hosts in TRUSTED-DEV: the harness writes
  # code and a human reviews every diff, so a human-approved gate holds every integrate
  # (the `postcondition: [human-approved]` on the integrate stage above). Switching to
  # `autonomous` later would require approval only for TCB-touching diffs — the tcb_paths
  # below — earning no-human-review for non-TCB work while keeping the TCB human-reviewed
  # permanently. See specs/bootstrap.md "Two thresholds".
  profile: trusted-dev
  # The TCB boundary as config: a candidate whose diff touches any of these globs requires
  # human approval regardless of profile (so the trust-enforcing core is never silently
  # rewritten). This same list is the operational definition of "which modules are the TCB"
  # — the orchestrator, runner/broker, sandbox config, and gate harness. See specs/bootstrap.md.
  tcb_paths:
    - internal/orchestrator/**
    - internal/runner/**
    - internal/broker/**
    - internal/sandbox/**
    - internal/gate/**
    - internal/messaging/**
    - config/**
